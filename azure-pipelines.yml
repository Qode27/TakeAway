# =====================================================================
#  Order Hub - CI/CD pipeline
#
#  CI  (Continuous Integration): test the code, build a Docker image,
#       push the image to Azure Container Registry (ACR)
#  CD  (Continuous Delivery):    deploy that exact image to Kubernetes (AKS)
#
#  Every push to "main" runs the whole pipeline automatically.
# =====================================================================

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

# ---------------------------------------------------------------------
#  CHANGE THESE to match what you created in the Azure portal
# ---------------------------------------------------------------------
variables:
  azureServiceConnection: 'azure-connection'   # Azure DevOps > Project settings > Service connections
  resourceGroup: 'takeaway-rg'                 # Resource group that holds everything
  acrName: 'takeawayacr'                       # ACR name (without .azurecr.io)
  aksName: 'takeaway-aks'                      # AKS cluster name
  imageName: 'takeaway'                        # Name of the image inside ACR
  imageTag: '$(Build.BuildId)'                 # Every build gets a unique tag: 1, 2, 3 ...

stages:
  # ===================================================================
  #  STAGE 1 - CI
  # ===================================================================
  - stage: CI
    displayName: 'CI - Test, Build & Push image'
    jobs:
      - job: Test
        displayName: 'Install, lint and test'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js 22'
            inputs:
              versionSpec: '22.x'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm run lint
            displayName: 'Lint (type check)'

          - script: npm test
            displayName: 'Run unit tests'

      - job: BuildImage
        displayName: 'Build & push Docker image'
        dependsOn: Test                      # only build the image if tests passed
        steps:
          - task: AzureCLI@2
            displayName: 'docker build + docker push to ACR'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                IMAGE=$(acrName).azurecr.io/$(imageName)

                echo "Logging in to ACR..."
                az acr login --name $(acrName)

                echo "Building image $IMAGE:$(imageTag)"
                docker build -t $IMAGE:$(imageTag) -t $IMAGE:latest .

                echo "Pushing image to ACR..."
                docker push $IMAGE:$(imageTag)
                docker push $IMAGE:latest

  # ===================================================================
  #  STAGE 2 - CD
  # ===================================================================
  - stage: CD
    displayName: 'CD - Deploy to Kubernetes'
    dependsOn: CI
    condition: succeeded()
    jobs:
      - deployment: Deploy
        displayName: 'Deploy image to AKS'
        environment: 'production'            # add an approval on this environment to demo manual gates
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self               # we need the k8s/*.yaml files

                - task: AzureCLI@2
                  displayName: 'kubectl apply'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      echo "Connecting kubectl to the AKS cluster..."
                      az aks get-credentials -g $(resourceGroup) -n $(aksName) --overwrite-existing

                      IMAGE=$(acrName).azurecr.io/$(imageName):$(imageTag)
                      echo "Deploying image $IMAGE"
                      sed -i "s|IMAGE_PLACEHOLDER|$IMAGE|" k8s/deployment.yaml

                      kubectl apply -f k8s/

                      echo "Waiting for the new pods to be ready..."
                      kubectl rollout status deployment/takeaway --timeout=5m

                      kubectl get pods -l app=takeaway -o wide

                - task: AzureCLI@2
                  displayName: 'Smoke test - is the app alive?'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials -g $(resourceGroup) -n $(aksName) --overwrite-existing
                      echo "Waiting for the public IP (first deploy takes 1-2 minutes)..."
                      for i in $(seq 1 30); do
                        IP=$(kubectl get service takeaway -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
                        if [ -n "$IP" ] && curl -fsS http://$IP/api/health; then
                          echo ""
                          echo "App is live at http://$IP"
                          exit 0
                        fi
                        echo "Not ready yet ($i/30), waiting 10s..."
                        sleep 10
                      done
                      echo "App did not become healthy. Try: kubectl get pods / kubectl logs deployment/takeaway"
                      exit 1
