# Run the whole app locally with Docker:
#   docker compose -f infra/docker-compose.yml up --build
# Then open http://localhost:4000  (login: admin@orderhub.ie / Password123!)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Only needed for "npm run dev" with background workers on; the app container below doesn't use it
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/order_hub
      REDIS_URL: redis://not-used
      ENABLE_BACKGROUND_WORKERS: "false"
      JWT_ACCESS_SECRET: local-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: local-refresh-secret-at-least-32-characters
      APP_ORIGIN: http://localhost:4000
    ports:
      - "4000:4000"

volumes:
  postgres_data:
